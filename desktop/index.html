<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 占位:真正的标题由组装根按注册进来的垂类品牌名写入(见 main.tsx)。
         🔴 别在这里写死栏目名 —— 这是 Core 的壳,换个行业不该改它。 -->
    <title>Vibe AStock</title>
    <!-- 站点图标:desktop/public/ 下的文件,由 assets/icon-source.png 缩出 -->
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- 首帧就按上次选择上色,避免深色用户先闪一下白屏(令牌默认是浅色) -->
    <script>
      try {
        var t = localStorage.getItem("vra-theme");
        document.documentElement.dataset.theme = t === "light" ? "light" : "dark";
      } catch (e) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
